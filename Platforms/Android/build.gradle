// build.gradle для подключения Flutter Engine зависимостей для Finik SDK
// Этот файл необходим для загрузки Flutter runtime, который используется внутри Finik SDK
// В .NET MAUI этот файл может использоваться дополнительно к настройкам в .csproj

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { 
            url "https://storage.googleapis.com/download.flutter.io" 
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { 
            url "https://storage.googleapis.com/download.flutter.io" 
        }
    }
}

// Flutter Engine зависимости для Finik SDK
// Finik SDK 2.7.1 требует Flutter Engine версии 3.16.5 для работы
// 
// ВАЖНО: В MAUI проектах зависимости обычно добавляются через .csproj,
// но Gradle может автоматически подтянуть зависимости, если они указаны здесь
//
// Flutter Engine должен быть включен как транзитивная зависимость Finik SDK AAR,
// но если это не работает, Gradle попытается скачать их автоматически

dependencies {
    // Flutter Engine для Finik SDK (версия 3.16.5)
    // Gradle автоматически скачает эти зависимости при сборке
    implementation 'io.flutter:flutter_embedding_release:3.16.5'
    implementation 'io.flutter:flutter_engine_release:3.16.5'
}

